[package]
name = "esc-preflight"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT-0"
publish = false
description = "Preflight check for the AWS European Sovereign Cloud: reports what in a CloudFormation template, CDK app or Terraform plan breaks there, and why."
readme = "README.md"

[dependencies]
aws-config = { version = "1.13.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-credential-types = "1.3.1"
aws-types = "1.7.0"
aws-sigv4 = { version = "1.6.4", default-features = false, features = ["sign-http"] }
clap = { version = "4.6.7", features = ["derive"] }
regex-lite = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }
saphyr = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
